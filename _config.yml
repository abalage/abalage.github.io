remote_theme: mmistakes/minimal-mistakes@4.28.1
url: https://balagetech.com
baseurl: ""
title: Balagetech
description: Engineer this, engineer that, engineer everything.. then ruin all the fun with a single typo.
permalink: /:year/:month/:day/:title/
kramdown:
  parse_block_html: true
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-include-cache
exclude:
  - Gemfile
  - Gemfile.lock
  - wp/
  - AGENTS.md

# Search
lunr:
  search_within_pages: true
search: true

# Theme configuration
minimal_mistakes_skin: "dark" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site images (migrated from the WordPress backup)
logo: "/assets/images/logo.jpeg"        # masthead logo (WP custom_logo)
teaser: "/assets/images/header.jpg"      # site default teaser (WP site header image)
og_image: "/assets/images/header.jpg"    # fallback Open Graph / Twitter card image
defaults:
  - scope:
      path: ""
    values:
      layout: "splash"
      toc: true
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      show_date: true
      read_time: true
paginate: 8 # amount of posts to show
paginate_path: /page:num/

author:
  name: "Balázs Németh"
  avatar: "/assets/images/bio-photo.png"
  bio: "Engineer this, engineer that, engineer everything.. then ruin all the fun with a single typo." # Note: Markdown is allowed
  location: "Hungary"
  links:
    - label: "LinkedIn"
      icon: "fas fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/bal%C3%A1zs-n%C3%A9meth-35126438/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/abalage"